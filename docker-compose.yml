services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    ports:
      - "${LEDGER_PG_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger"]
      interval: 2s
      timeout: 2s
      retries: 15

  api:
    build: .
    environment:
      ConnectionStrings__Ledger: Host=postgres;Port=5432;Database=ledger;Username=ledger;Password=ledger
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "${LEDGER_API_PORT:-8088}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
